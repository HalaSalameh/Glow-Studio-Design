kind = "web"
previewPath = "/"
title = "Beauty Clinic Website"
version = "1.0.0"
id = "artifacts/beauty-clinic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21315

[services.development]
run = "node /home/runner/workspace/artifacts/beauty-clinic/serve.js"

[services.production]
publicDir = "artifacts/beauty-clinic"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21315"
BASE_PATH = "/"
